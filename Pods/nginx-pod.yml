apiVersion: v1
kind: Pod
metadata: 
  name: nginx-pods
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      env:
        - name: ENV
          value: UAT
      command: ["nginx"]
      args: ["-g","daemon off;"]
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html

    - name: sidecar
      image: busybox:stable
      command: ["sh","-c"]
      
      args: 
        - | 
          while true; do
            echo "$(date -u): sidecar wrote to shared volume" >> /data/sidecar.log
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /data
      
      volumes:
        - name: shared-data
          emptyDir: {}