apiVersion: v1
kind: Pod
metadata: 
  name: nginx-Pods
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      env:
        - name: ENV
          value: UAT
      command: ["nginx"]
      args: ["-g","daemon off;"]
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
